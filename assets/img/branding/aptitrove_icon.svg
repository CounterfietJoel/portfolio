<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded container with Forest Green background -->
  <rect width="64" height="64" rx="14" fill="#164C3A" />
  
  <!-- 4-Quadrant Reticle Aperture in White -->
  <g transform="translate(32, 32)">
    <!-- Top-Right Quadrant -->
    <path d="M 4 -22 A 22 22 0 0 1 22 -4 L 14 -4 A 14 14 0 0 0 4 -14 Z" fill="#FFFFFF" />
    <!-- Bottom-Right Quadrant -->
    <path d="M 22 4 A 22 22 0 0 1 4 22 L 4 14 A 14 14 0 0 0 14 4 Z" fill="#FFFFFF" />
    <!-- Bottom-Left Quadrant -->
    <path d="M -4 22 A 22 22 0 0 1 -22 4 L -14 4 A 14 14 0 0 0 -4 14 Z" fill="#FFFFFF" />
    <!-- Top-Left Quadrant -->
    <path d="M -22 -4 A 22 22 0 0 1 -4 -22 L -4 -14 A 14 14 0 0 0 -14 -4 Z" fill="#FFFFFF" />

    <!-- Center Reticle Crosshairs -->
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    <line x1="-7" y1="0" x2="-3" y2="0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="3" y1="0" x2="7" y2="0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="-7" x2="0" y2="-3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="3" x2="0" y2="7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
